name: Daily Climate Data Update

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-climate-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Run data pipeline
        run: |
          python src/data_pipeline/fetch_weather.py
          python src/analysis/feature_engineering.py
          python src/analysis/drought_index.py

      - name: Train and validate drought model
        run: python src/models/train_drought_model.py

      - name: Commit and push updated data and model
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Terralitik Auto-Bot"
          git add data/raw/ data/processed/ artifacts/

          if git diff --staged --quiet; then
            echo "Tidak ada data baru untuk di-commit."
          else
            git commit -m "Auto-update: daily climate data and model"
            git push
          fi
